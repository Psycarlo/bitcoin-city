<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bitcoin City: the bitcoin blockchain, live, as a 3D city. Every block a district, every transaction a building."
    />
    <title>Bitcoin City</title>
    <script>
      // The saved theme (else the system's), before anything paints.
      try {
        var saved = JSON.parse(localStorage.getItem("blockcity.theme") || "{}");
        var theme =
          (saved.state && saved.state.theme) ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
